name: Build Android Release (AAB & APK)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android App Bundle & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore (if secret present)
        if: "${{ secrets.KEYSTORE_BASE64 != '' }}"
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks

      - name: Build Android App Bundle (AAB for Google Play)
        env:
          KEYSTORE_PATH: "my-upload-key.jks"
          STORE_PASSWORD: "${{ secrets.STORE_PASSWORD }}"
          KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
        run: gradle bundleRelease --stacktrace

      - name: Build Universal APK
        env:
          KEYSTORE_PATH: "my-upload-key.jks"
          STORE_PASSWORD: "${{ secrets.STORE_PASSWORD }}"
          KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
        run: gradle assembleRelease --stacktrace

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wasalni-Release-Bundle-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wasalni-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore

      - name: Upload Debug APK (Fallback)
        if: failure()
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Wasalni-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
