name: Build Wassalni APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew clean assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Rename APK
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk wassalni.apk
          else
            echo "Searching for generated debug APK..."
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} wassalni.apk \;
          fi

      - name: Upload wassalni.apk
        uses: actions/upload-artifact@v4
        with:
          name: wassalni-apk
          path: wassalni.apk
