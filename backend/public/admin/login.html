<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>وصلني | دخول الإدارة</title>
  <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand-mark">و</div>
    <h1>لوحة تحكم وصلني</h1>
    <p class="muted">تسجيل دخول الإدارة</p>
    <form id="loginForm" novalidate>
      <label for="identity">البريد الإلكتروني أو رقم الهاتف</label>
      <input id="identity" name="identity" autocomplete="username" required placeholder="admin@example.com">
      <label for="password">كلمة المرور</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
      <button id="loginButton" type="submit" class="primary">دخول إلى لوحة التحكم</button>
      <p id="error" class="error" role="alert" hidden></p>
    </form>
  </main>
  <script src="/admin/assets/login.js" defer></script>
</body>
</html>
